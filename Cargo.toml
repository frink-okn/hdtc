[package]
name = "hdtc"
version = "1.1.0"
edition = "2024"
description = "HDT Creator - converts RDF files to HDT format"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc = "3"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
rayon = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
oxrdfio = "0.2"
oxrdf = "0.3"
indicatif = "0.17"
zstd = "0.13"
crossbeam-channel = "0.5"
hashbrown = "0.15"
bumpalo = "3"
bitflags = "2"
libc = "0.2"
md5 = "0.8"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# Exact pin: see docs/sketch-format.md §5.5. Safe to move; `cargo test` says what
# to do if the emitted bytes change.
xorf = { version = "=0.12.0", default-features = false, features = ["binary-fuse"] }
# Exact pin: see docs/text-index-format.md §1.1. Unlike the other artifacts, a
# text index's bytes are the dependency's own segment format, so the version is
# part of the published contract and is recorded in every index manifest —
# `linked_tantivy_version()` reads it back out of the crate, so this pin cannot
# drift from what indexes are labelled with. Moving it may change segment
# compatibility; opening remains Tantivy's decision, while frozen-index tests
# catch incompatible upgrades.
tantivy = "=0.26.1"

[dev-dependencies]
hdt = "0.4"
libtest-mimic = "0.8"

[[test]]
name = "roundtrip_test"
harness = false

[profile.release]
lto = true
codegen-units = 1

# xorf's debug-only duplicate check builds an unbounded BTreeSet before the
# bounded filter construction. `read_distinct_keys` in src/hdt/sketch.rs sorts
# and deduplicates every key set before handing it over, so keep development
# builds on the production memory path. This does not affect overflow checks,
# which Cargo controls separately and leaves on for dev; release builds are why
# the key ceiling is enforced in our code (MAX_BINARY_FUSE_KEYS,
# docs/sketch-format.md §5.3) rather than left to a panic.
[profile.dev.package.xorf]
debug-assertions = false
