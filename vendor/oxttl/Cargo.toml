# Vendored copy of oxttl 0.2.3 (MIT OR Apache-2.0), modified by hdtc.
#
# It is a direct dependency of hdtc, renamed `oxttl-hdtc` (library `oxttl_hdtc`)
# so it coexists with the registry oxttl that oxrdfio still uses for the formats
# hdtc does not build itself. A `[patch]` would apply only to hdtc's own build
# and break every crate that depends on hdtc. There is no patch section anywhere.
#
# Changes from the released 0.2.3, all in `src/toolkit/lexer.rs` unless noted.
# The blocking and async readers share one `prepare_read`/`finish_read` pair,
# so each change below has a single definition; hdtc does not enable the
# `async-tokio` feature and never compiles the async reader.
#
# 1. Backport of oxigraph commit de4dc5f04: every parser gains
#    `with_max_buffer_size`, so a caller can raise the 16 MiB bound on a single
#    IRI or literal (`src/{trig,turtle,ntriples,nquads,n3}.rs`, `lib.rs`,
#    `terse.rs`, `line_formats.rs`).
# 2. Buffer growth is clamped to the bound. Vec growth could carry the buffer
#    past a bound that is not a power of two; the overshoot was then shrunk away
#    on the next read, which discarded bytes and read an empty slice as end of
#    input. hdtc's own fix.
# 3. A failed read truncates the zero padding it had reserved, so a retried
#    read (the right response to an interrupted one) does not parse the padding
#    as data. hdtc's own fix.
# 4. The buffer compacts at the point the default bound implies (8 MiB) rather
#    than at half of whatever bound is configured, so raising the bound does not
#    raise resident memory for inputs without line breaks. hdtc's own fix.
# 5. The over-bound error carries a typed cause, `BufferLimitExceeded`, so hdtc
#    can tell it from any other `OutOfMemory` I/O error. hdtc's own addition.
# 6. A full buffer is compacted of its consumed prefix before the current token
#    is judged too large, so the bound applies to one term, not to the terms of
#    a statement together. hdtc's own fix.
#
# Replacing this directory with an upstream release requires that release to
# cover items 2–6 as well as item 1; check before dropping it.
#
# The manifest below is the crates.io-normalized one from the 0.2.3 package,
# with the package and library renamed.
[package]
edition = "2024"
rust-version = "1.87"
name = "oxttl-hdtc"
version = "0.2.3"
authors = ["Tpt <thomas@pellissier-tanon.fr>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Parser and serializer for languages related to RDF Turtle (N-Triples, N-Quads, Turtle, TriG and N3)"
documentation = "https://docs.rs/oxttl"
readme = "README.md"
keywords = [
    "N-Triples",
    "N-Quads",
    "Turtle",
    "TriG",
    "N3",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/oxigraph/oxigraph/tree/master/lib/oxttl"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
async-tokio = ["dep:tokio"]
default = []
rdf-12 = ["oxrdf/rdf-12"]

[lib]
name = "oxttl_hdtc"
path = "src/lib.rs"

[dependencies.memchr]
version = "2.5"

[dependencies.oxilangtag]
version = "0.1"

[dependencies.oxiri]
version = "0.2.11"

[dependencies.oxrdf]
version = "=0.3.3"

[dependencies.thiserror]
version = ">=1.0.50, <3.0"

[dependencies.tokio]
version = "1.29"
features = ["io-util"]
optional = true

[dev-dependencies.rayon]
version = "1.8.1"

[dev-dependencies.tempfile]
version = "3.1"

[dev-dependencies.tokio]
version = "1.29"
features = [
    "rt",
    "macros",
]

